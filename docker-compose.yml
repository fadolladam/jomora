name: jomora

# Every service is gated behind this profile so a plain `docker compose up`
# cannot accidentally create a new database. The database volume is new and
# must only be initialized after the owner approves it.
services:
  database:
    profiles: [local-db]
    image: mysql:8.0
    container_name: jomora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jomora_dev}
      MYSQL_USER: ${DB_USERNAME:-jomora_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-change-me}
    ports:
      - "127.0.0.1:${DB_PORT:-20000}:3306"
    volumes:
      - jomora_mysql_data:/var/lib/mysql
    networks:
      - jomora-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    profiles: [local-db]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jomora-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_NAME: Jomora
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-jomora_dev}
      DB_USERNAME: ${DB_USERNAME:-jomora_app}
      DB_PASSWORD: ${DB_PASSWORD:-local-change-me}
      SESSION_DRIVER: file
      SESSION_LIFETIME: 480
      SESSION_DOMAIN: null
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: localhost:10001,127.0.0.1:10001
      CORS_ALLOWED_ORIGINS: http://localhost:10001
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/html
      - jomora_backend_vendor:/var/www/html/vendor
      - jomora_backend_storage:/var/www/html/storage
      - jomora_backend_cache:/var/www/html/bootstrap/cache
    networks:
      - jomora-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    profiles: [local-db]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jomora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:10001:5173"
    volumes:
      - ./frontend:/app
      - jomora_frontend_node_modules:/app/node_modules
    networks:
      - jomora-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  jomora_mysql_data:
    name: jomora_mysql_data
  jomora_backend_vendor:
    name: jomora_backend_vendor
  jomora_backend_storage:
    name: jomora_backend_storage
  jomora_backend_cache:
    name: jomora_backend_cache
  jomora_frontend_node_modules:
    name: jomora_frontend_node_modules

networks:
  jomora-network:
    name: jomora-network
